name: IndexNow

# After main changes, wait for Render to deploy, then ask search engines to recrawl.
on:
  push:
    branches: [main]
    paths: ['content/**', 'src/content/**', 'scripts/prerender.ts', 'public/og/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Wait for the deploy
        run: sleep 600
      - name: Submit URLs
        run: node scripts/indexnow.mjs
